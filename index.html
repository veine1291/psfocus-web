<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F1F2F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- 不能用 no-store,会禁掉 iOS / Chrome 的 BFCache,导致每次切回 tab 都要全量 reload -->
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <title>PS Focus</title>
  <link rel="stylesheet" href="style.css?v=20260601-1230">
</head>
<body>

<noscript>
  <div class="ns-block">此浏览器禁用了 JavaScript,请打开 JS 后刷新页面。</div>
</noscript>

<!-- 致命错误提示(JS 加载失败时显示) -->
<div id="fatal-err" class="fatal-err hidden">
  <div class="fatal-err-card">
    <div class="fatal-err-title">加载失败</div>
    <div id="fatal-err-msg" class="fatal-err-msg"></div>
    <div class="fatal-err-tip">请尝试用 Safari 或换网络重试。</div>
  </div>
</div>

<!-- 登录页 -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">PS Focus</div>
    <div class="auth-sub">登录以同步桌面端数据</div>
    <input id="auth-email" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="username" placeholder="用户名">
    <input id="auth-pass" type="password" autocomplete="current-password" placeholder="密码">
    <label class="auth-remember-row">
      <input type="checkbox" id="auth-remember" checked>
      <span>记住密码(下次自动登录)</span>
    </label>
    <button id="auth-login-btn" class="btn-primary">登录</button>
    <button id="auth-signup-btn" class="btn-link">没有账号?注册</button>
    <div id="auth-msg" class="auth-msg"></div>
  </div>
</div>

<!-- 主应用 -->
<div id="app" class="app hidden">

  <!-- 顶部栏 -->
  <header class="topbar">
    <button id="topbar-left-btn" class="topbar-btn" aria-label="清单">
      <span class="ico-list"></span>
    </button>
    <div class="topbar-title">
      <span id="topbar-title">任务</span>
      <span id="topbar-subtitle" class="topbar-subtitle"></span>
    </div>
    <button id="topbar-right-btn2" class="topbar-btn hidden" aria-label=""></button>
    <button id="topbar-right-btn" class="topbar-btn" aria-label="更多">
      <span class="ico-more"></span>
    </button>
  </header>

  <!-- 内容区 -->
  <main id="view" class="view"></main>

  <!-- 浮动新建按钮 -->
  <button id="fab" class="fab hidden" aria-label="新建">
    <span class="ico-plus"></span>
  </button>

  <!-- 底部 tab bar(由 renderTabBar 动态填充)-->
  <nav class="tabbar"></nav>

  <!-- 同步状态条(顶栏底下、view 上面的细条) -->
  <div id="sync-bar" class="sync-bar hidden">
    <span id="sync-dot" class="sync-dot"></span>
    <span id="sync-text" class="sync-text">同步中…</span>
  </div>
</div>

<!-- 左侧清单导航抽屉 -->
<div id="drawer-nav" class="drawer drawer-left hidden">
  <div class="drawer-mask" data-action="close-drawer-nav"></div>
  <aside class="drawer-panel">
    <header class="drawer-head">
      <div class="drawer-user">
        <span class="drawer-user-avatar"></span>
        <span id="drawer-user-name">未登录</span>
      </div>
    </header>
    <div id="drawer-nav-body" class="drawer-body"></div>
  </aside>
</div>

<!-- 右侧抽屉(日历任务侧栏) -->
<div id="drawer-right" class="drawer drawer-right hidden">
  <div class="drawer-mask" data-action="close-drawer-right"></div>
  <aside class="drawer-panel">
    <div id="drawer-right-body" class="drawer-right-body"></div>
  </aside>
</div>

<!-- 顶部菜单(右上 ⋯)— 上下文相关,内容由 JS 渲染 -->
<div id="popover" class="popover hidden">
  <div class="popover-mask" data-action="close-popover"></div>
  <div id="popover-body" class="popover-body"></div>
</div>

<!-- 底部抽屉(任务详情/新建任务等) -->
<div id="sheet" class="sheet hidden">
  <div class="sheet-mask" data-action="close-sheet"></div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<!-- 全屏笔记编辑页 (新建摘要 / 编辑笔记) — 长文本不适合用 sheet, 单独全屏 -->
<div id="sum-editor-page" class="sum-editor-page hidden">
  <div id="sum-editor-page-body" class="sum-editor-page-body"></div>
</div>

<!-- 全屏手写画布 (Kayu 2026-05-29 提议) — 笔 + 颜色 + 橡皮 + 框选移动/缩放, 结束导出 PNG 进 pendingImages -->
<div id="canvas-page" class="canvas-page hidden">
  <header class="cvp-topbar">
    <button class="cvp-topbar-btn" data-action="canvas-close" aria-label="返回"><span class="ico-chevron-left"></span></button>
    <div class="cvp-topbar-title">手写画布</div>
    <button id="cvp-topbar-ocr" class="cvp-topbar-ocr" data-action="canvas-ocr" title="识别为文字">识别</button>
    <button class="cvp-topbar-done" data-action="canvas-done" title="把画布作为附图加到笔记">插入笔记</button>
  </header>
  <div class="cvp-toolbar" id="cvp-toolbar"></div>
  <div class="cvp-stage" id="cvp-stage">
    <canvas id="cvp-canvas" class="cvp-canvas"></canvas>
    <!-- 调试: 实时显示笔画数 / 历史索引 / 最近事件, 用于排查"笔画消失"问题 -->
    <div id="cvp-debug" class="cvp-debug">init</div>
    <!-- 颜色 / 笔粗滑条的 popover, 由 JS 动态填入 -->
    <div id="cvp-popover" class="cvp-popover hidden"></div>
  </div>
  <!-- 页面侧栏 — 从右滑入, 列出所有页缩略图 -->
  <div id="cvp-pages-sidebar" class="cvp-pages-sidebar hidden"></div>
</div>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<!-- 腾讯云 CloudBase SDK(暴露 window.cloudbase) -->
<script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js?v=1"></script>
<script src="app.js?v=20260601-1230"></script>
</body>
</html>
